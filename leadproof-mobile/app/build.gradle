plugins { id 'com.android.application' }

android {
    namespace 'br.com.leadproof.vendareal'
    compileSdk 35

    defaultConfig {
        applicationId 'br.com.leadproof.vendareal'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
