plugins {
    id 'com.android.application'
}

def releaseStorePath = System.getenv('SAFE_CHECK_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('SAFE_CHECK_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('SAFE_CHECK_KEY_ALIAS')
def releaseKeyPassword = System.getenv('SAFE_CHECK_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.app.detectorgolpeai'
    compileSdk 35

    defaultConfig {
        applicationId 'com.app.detectorgolpeai'
        minSdk 24
        targetSdk 35
        versionCode 14
        versionName '2.5.0'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.mlkit:text-recognition:16.0.1'
}
