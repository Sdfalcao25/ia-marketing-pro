name: Build SafeCheck Cloud APK

on:
  push:
    branches:
      - safecheck-cloud-v2
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector-golpes-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SafeCheck JavaScript patches
        run: |
          node --check app/src/main/assets/auth_patch.js
          node --check app/src/main/assets/ui_patch.js
          node --check app/src/main/assets/risk_patch.js
          node --check app/src/main/assets/client_patch_230.js
          node --check app/src/main/assets/freemium_patch_240.js
          node --check app/src/main/assets/audit_patch_242.js
          grep -F "Carlos Alisson Silva Falcão Lins" app/src/main/assets/ui_patch.js
          grep -F "hideTechnicalInfrastructure" app/src/main/assets/client_patch_230.js
          grep -F "FREE_LIMIT=5" app/src/main/assets/freemium_patch_240.js
          grep -F "safecheck-paid-analyze" app/src/main/assets/freemium_patch_240.js
          grep -F "A URL menciona uma marca conhecida" app/src/main/assets/audit_patch_242.js
          grep -F "/auth/v1/logout" app/src/main/assets/audit_patch_242.js
          grep -F "toLocaleDateString('en-CA')" app/src/main/assets/audit_patch_242.js
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml

      - name: Verify Supabase endpoints
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/auth/v1/settings' > /tmp/safecheck-auth-settings.json
          test -s /tmp/safecheck-auth-settings.json
          paid_code=$(curl --silent --output /tmp/safecheck-paid.txt --write-out '%{http_code}' \
            -X POST -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' -H 'Content-Type: application/json' \
            --data '{"type":"message","text":"teste"}' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-paid-analyze')
          billing_code=$(curl --silent --output /tmp/safecheck-billing.txt --write-out '%{http_code}' \
            -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-billing')
          legacy_code=$(curl --silent --output /tmp/safecheck-legacy.txt --write-out '%{http_code}' \
            -X POST -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' -H 'Content-Type: application/json' \
            --data '{"type":"message","text":"teste"}' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/anti-golpe-api/analysis/message')
          echo "Paid endpoint unauthenticated HTTP $paid_code"
          echo "Billing endpoint unauthenticated HTTP $billing_code"
          echo "Legacy endpoint HTTP $legacy_code"
          test "$paid_code" = "401"
          test "$billing_code" = "401"
          test "$legacy_code" = "410"

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK, signature and launcher metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/badging.txt
          grep "versionCode='10'" /tmp/badging.txt
          grep "versionName='2.4.2'" /tmp/badging.txt
          grep "application-label:'SafeCheck AI'" /tmp/badging.txt
          grep "application-icon-" /tmp/badging.txt

      - name: Verify bundled audit patches
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/client_patch_230.js > /tmp/client_patch_230.js
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/freemium_patch_240.js > /tmp/freemium_patch_240.js
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/audit_patch_242.js > /tmp/audit_patch_242.js
          grep -F "upgradeQuickIcons" /tmp/client_patch_230.js
          grep -F "openPlans" /tmp/freemium_patch_240.js
          grep -F "safecheck-paid-analyze" /tmp/freemium_patch_240.js
          grep -F "5 análises locais" /tmp/freemium_patch_240.js
          grep -F "brand" /tmp/audit_patch_242.js
          grep -F "/auth/v1/logout" /tmp/audit_patch_242.js
          grep -F "localDay" /tmp/audit_patch_242.js

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safecheck-ai-2.4.2-final-audit-apk
          path: detector-golpes-standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare public APK download
        run: cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/SafeCheck-AI-2.4.2.apk"

      - name: Publish public GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="safecheck-ai-v2.4.2"
          APK="$GITHUB_WORKSPACE/SafeCheck-AI-2.4.2.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#SafeCheck-AI-2.4.2.apk" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$APK#SafeCheck-AI-2.4.2.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target safecheck-cloud-v2 \
              --title "SafeCheck AI 2.4.2" \
              --notes "SafeCheck AI 2.4.2 para Android. Versão freemium auditada para testes e instalação direta. O Android pode solicitar autorização para instalar aplicativos de fontes externas."
          fi
