name: Validate SafeCheck Android

on:
  push:
    branches:
      - safecheck-cloud-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector-golpes-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SafeCheck JavaScript patches
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done
          grep -F "Carlos Alisson Silva Falcão Lins" app/src/main/assets/ui_patch.js
          grep -F "safecheck-paid-analyze" app/src/main/assets/freemium_patch_240.js
          grep -F "safecheck-checkout" app/src/main/assets/asaas_billing_patch_245.js
          grep -F "safecheck-subscription-manage" app/src/main/assets/asaas_billing_patch_245.js
          grep -F 'android:allowBackup="false"' app/src/main/AndroidManifest.xml
          grep -F 'MAX_FILE_BYTES = 12L * 1024L * 1024L' app/src/main/java/com/app/detectorgolpeai/FileTextExtractor.java

      - name: Verify protected Supabase endpoints
        shell: bash
        run: |
          curl --fail --silent --show-error -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' 'https://pwlblezbjnumlmqevcgu.supabase.co/auth/v1/settings' > /tmp/safecheck-auth-settings.json
          test -s /tmp/safecheck-auth-settings.json
          paid_code=$(curl --silent --output /tmp/safecheck-paid.txt --write-out '%{http_code}' -X POST -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' -H 'Content-Type: application/json' --data '{"type":"message","text":"teste"}' 'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-paid-analyze')
          billing_code=$(curl --silent --output /tmp/safecheck-billing.txt --write-out '%{http_code}' -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' 'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-billing')
          checkout_code=$(curl --silent --output /tmp/safecheck-checkout.txt --write-out '%{http_code}' -X POST -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' -H 'Content-Type: application/json' --data '{"plan":"pro"}' 'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-checkout')
          manage_code=$(curl --silent --output /tmp/safecheck-manage.txt --write-out '%{http_code}' -X POST -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' -H 'Content-Type: application/json' --data '{"action":"cancel"}' 'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-subscription-manage')
          test "$paid_code" = "401"
          test "$billing_code" = "401"
          test "$checkout_code" = "401"
          test "$manage_code" = "401"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile validation APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify validation APK and metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/badging.txt
          grep "versionCode='14'" /tmp/badging.txt
          grep "versionName='2.5.0'" /tmp/badging.txt
          grep "application-label:'SafeCheck AI'" /tmp/badging.txt

      - name: Upload validation artifact only
        uses: actions/upload-artifact@v4
        with:
          name: safecheck-ai-2.5.0-validation-debug
          path: detector-golpes-standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
