name: Build SafeCheck Cloud APK

on:
  push:
    branches:
      - safecheck-cloud-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector-golpes-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate SafeCheck JavaScript patches
        run: |
          node --check app/src/main/assets/auth_patch.js
          node --check app/src/main/assets/ui_patch.js
          node --check app/src/main/assets/risk_patch.js
          node --check app/src/main/assets/client_patch_230.js
          grep -F "Carlos Alisson Silva Falcão Lins" app/src/main/assets/ui_patch.js
          grep -F "senior-light" app/src/main/assets/ui_patch.js
          grep -F "domain_age_days" app/src/main/assets/risk_patch.js
          grep -F "upgradeQuickIcons" app/src/main/assets/client_patch_230.js
          grep -F "hideTechnicalInfrastructure" app/src/main/assets/client_patch_230.js
          grep -F "IA + análise técnica" app/src/main/assets/client_patch_230.js

      - name: Verify Supabase Auth endpoint
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/auth/v1/settings' > /tmp/safecheck-auth-settings.json
          test -s /tmp/safecheck-auth-settings.json

      - name: Verify protected analysis endpoint
        shell: bash
        run: |
          code=$(curl --silent --output /tmp/safecheck-edge.txt --write-out '%{http_code}' \
            -X POST \
            -H 'apikey: sb_publishable_lMH0rekwoginS5J1uluLAA_enPag-vv' \
            -H 'Content-Type: application/json' \
            --data '{"type":"message","text":"teste"}' \
            'https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/safecheck-analyze')
          echo "Protected endpoint returned HTTP $code without a user session"
          test "$code" = "401"

      - name: Compile debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify APK, signature and launcher metadata
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk > /tmp/badging.txt
          grep "versionName='2.3.0'" /tmp/badging.txt
          grep "application-label:'SafeCheck AI'" /tmp/badging.txt
          grep "application-icon-" /tmp/badging.txt

      - name: Verify bundled customer patch
        run: |
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/client_patch_230.js > /tmp/client_patch_230.js
          grep -F "upgradeQuickIcons" /tmp/client_patch_230.js
          grep -F "hideTechnicalInfrastructure" /tmp/client_patch_230.js
          grep -F "Proteção digital contra golpes" /tmp/client_patch_230.js

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: safecheck-ai-2.3.0-hybrid-ai-professional-ui-apk
          path: detector-golpes-standalone/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
