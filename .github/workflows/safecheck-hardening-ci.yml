name: SafeCheck 2.5 Hardening CI

on:
  push:
    branches:
      - safecheck-2.5-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-hardening:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector-golpes-standalone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify OCR hardening guards
        run: |
          grep -F 'MAX_FILE_BYTES = 12L * 1024L * 1024L' app/src/main/java/com/app/detectorgolpeai/FileTextExtractor.java
          grep -F 'MAX_IMAGE_SIDE = 8000' app/src/main/java/com/app/detectorgolpeai/FileTextExtractor.java
          grep -F 'hasPdfSignature' app/src/main/java/com/app/detectorgolpeai/FileTextExtractor.java
          grep -F 'OutOfMemoryError' app/src/main/java/com/app/detectorgolpeai/FileTextExtractor.java

      - name: Validate JavaScript patches
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Compile debug validation APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Verify validation APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
