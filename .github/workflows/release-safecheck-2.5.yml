name: Release SafeCheck AI 2.5

on:
  workflow_dispatch:
  push:
    branches:
      - safecheck-2.5-hardening

permissions:
  contents: write

jobs:
  signed-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector-golpes-standalone
    env:
      SAFE_CHECK_KEYSTORE_PASSWORD: ${{ secrets.SAFE_CHECK_KEYSTORE_PASSWORD }}
      SAFE_CHECK_KEY_ALIAS: ${{ secrets.SAFE_CHECK_KEY_ALIAS }}
      SAFE_CHECK_KEY_PASSWORD: ${{ secrets.SAFE_CHECK_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          SAFE_CHECK_KEYSTORE_BASE64: ${{ secrets.SAFE_CHECK_KEYSTORE_BASE64 }}
        run: |
          test -n "$SAFE_CHECK_KEYSTORE_BASE64"
          test -n "$SAFE_CHECK_KEYSTORE_PASSWORD"
          test -n "$SAFE_CHECK_KEY_ALIAS"
          test -n "$SAFE_CHECK_KEY_PASSWORD"

      - name: Restore production keystore
        env:
          SAFE_CHECK_KEYSTORE_BASE64: ${{ secrets.SAFE_CHECK_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SAFE_CHECK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/safecheck-release.jks"
          chmod 600 "$RUNNER_TEMP/safecheck-release.jks"
          test -s "$RUNNER_TEMP/safecheck-release.jks"
          echo "SAFE_CHECK_KEYSTORE_PATH=$RUNNER_TEMP/safecheck-release.jks" >> "$GITHUB_ENV"

      - name: Validate production keystore
        run: |
          keytool -list \
            -keystore "$SAFE_CHECK_KEYSTORE_PATH" \
            -storepass "$SAFE_CHECK_KEYSTORE_PASSWORD" \
            -alias "$SAFE_CHECK_KEY_ALIAS" >/dev/null

      - name: Validate SafeCheck JavaScript assets
        run: |
          for file in app/src/main/assets/*.js; do node --check "$file"; done

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK and AAB
        run: gradle :app:clean :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify signed artifacts
        run: |
          test -f app/build/outputs/apk/release/app-release.apk
          test -f app/build/outputs/bundle/release/app-release.aab
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab 2>&1 | tee /tmp/safecheck-aab-verify.txt
          grep -qi "jar verified" /tmp/safecheck-aab-verify.txt
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/release/app-release.apk > /tmp/safecheck-badging.txt
          grep "versionCode='14'" /tmp/safecheck-badging.txt
          grep "versionName='2.5.0'" /tmp/safecheck-badging.txt
          grep "application-label:'SafeCheck AI'" /tmp/safecheck-badging.txt

      - name: Stage release files
        run: |
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/SafeCheck-AI-2.5.0.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/SafeCheck-AI-2.5.0.aab"
          sha256sum "$GITHUB_WORKSPACE/SafeCheck-AI-2.5.0.apk" "$GITHUB_WORKSPACE/SafeCheck-AI-2.5.0.aab" > "$GITHUB_WORKSPACE/SHA256SUMS.txt"

      - name: Upload signed build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safecheck-ai-2.5.0-signed
          path: |
            SafeCheck-AI-2.5.0.apk
            SafeCheck-AI-2.5.0.aab
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ${{ github.workspace }}
        run: |
          TAG='safecheck-ai-v2.5.0'
          gh release create "$TAG" SafeCheck-AI-2.5.0.apk SafeCheck-AI-2.5.0.aab SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target safecheck-2.5-hardening \
            --title 'SafeCheck AI 2.5.0' \
            --notes 'SafeCheck AI 2.5.0: release assinada, AAB para loja, proteção de arquivos/OCR e hardening de produção.'
