name: Build ANTI GOLPE AI APK

on:
  push:
    branches: [anti-golpe-ai]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          echo '2bd724b10f3b1523d4e1bb1c8de670f54d85b3e93dbe878a77f81df1fc8cbd41  anti-golpe-build/payload/part00a' | sha256sum -c -
          echo '8dc82f13aa33bcfa5629a1f3690451462d548daf9c15cb90cb3627831b8405a9  anti-golpe-build/payload/part00b' | sha256sum -c -
          cat anti-golpe-build/payload/part00a anti-golpe-build/payload/part00b anti-golpe-build/payload/part01 anti-golpe-build/payload/part02 anti-golpe-build/payload/part03 anti-golpe-build/payload/part04 anti-golpe-build/payload/part05 anti-golpe-build/payload/part06 anti-golpe-build/payload/part07 anti-golpe-build/payload/part08 > /tmp/anti_golpe_ai_source.zip.b64
          base64 -d /tmp/anti_golpe_ai_source.zip.b64 > /tmp/anti_golpe_ai_source.zip
          echo 'f80c469f23b96435805d53dfd87472d73c04c0cea27700d35463ab690d2b3e2a  /tmp/anti_golpe_ai_source.zip' | sha256sum -c -
          mkdir -p /tmp/anti-source
          unzip -q /tmp/anti_golpe_ai_source.zip -d /tmp/anti-source
          cp -a /tmp/anti-source/anti_golpe_ai/. "$GITHUB_WORKSPACE/"

      - name: Apply verified compile fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/features/analysis/analysis_form_screen.dart')
          s=p.read_text().replace("'Ex.: R$ 350,00'", "'Ex.: R\\$ 350,00'").replace("'Ex.: R$ 199,00'", "'Ex.: R\\$ 199,00'")
          p.write_text(s)
          p=Path('lib/features/analysis/local_ai_analysis_service.dart')
          s=p.read_text().replace("final confidence = (55 + evidence).clamp(55, 92);", "final confidence = (55 + evidence).clamp(55, 92).toInt();")
          p.write_text(s)
          for f in ['lib/features/analysis/result_screen.dart','lib/features/history/history_screen.dart']:
              p=Path(f); s=p.read_text(); marker="import '../../core/models/analysis.dart';"
              if "../../core/models/risk_level.dart" not in s:
                  s=s.replace(marker, marker+"\nimport '../../core/models/risk_level.dart';")
              p.write_text(s)
          p=Path('lib/features/analysis/result_screen.dart')
          p.write_text(p.read_text().replace('const Color(0x223FFFFFF)', 'const Color(0x223FFFFF)'))
          p=Path('test/widget_test.dart')
          p.write_text(p.read_text().replace("import 'package:flutter/material.dart';\n", ''))
          p=Path('lib/features/account/account_screen.dart')
          s=p.read_text().replace('if(ctx.mounted)ScaffoldMessenger.of(context).showSnackBar', 'if(ctx.mounted)ScaffoldMessenger.of(ctx).showSnackBar')
          p.write_text(s)
          PY

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: bash tool/bootstrap_android.sh

      - name: Resolve dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee flutter-analyze.log

      - name: Flutter tests
        run: flutter test 2>&1 | tee flutter-test.log

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Validate APK
        shell: bash
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-debug.apk
          file build/app/outputs/flutter-apk/app-debug.apk
          unzip -t build/app/outputs/flutter-apk/app-debug.apk >/dev/null
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee apk-sha256.txt
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-debug.apk dist/anti_golpe_ai.apk
          cp apk-sha256.txt dist/APK_SHA256.txt
          cp flutter-analyze.log dist/flutter-analyze.log
          cp flutter-test.log dist/flutter-test.log

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: anti-golpe-ai-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
