name: Build LeadProof Android APK
on:
  push:
    branches: [leadproof-premium-mobile]
    paths:
      - 'leadproof-mobile/**'
      - '.github/workflows/leadproof-android-apk.yml'
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p leadproof-mobile :app:assembleDebug --stacktrace
      - name: Verify APK signature and package
        run: |
          APK='leadproof-mobile/app/build/outputs/apk/debug/app-debug.apk'
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E "^package:|^application-label:|^sdkVersion:|^targetSdkVersion:"
      - name: Prepare artifact
        run: cp leadproof-mobile/app/build/outputs/apk/debug/app-debug.apk LeadProof-VendaReal-Premium.apk
      - uses: actions/upload-artifact@v4
        with:
          name: LeadProof-VendaReal-Premium-APK
          path: LeadProof-VendaReal-Premium.apk
          if-no-files-found: error
