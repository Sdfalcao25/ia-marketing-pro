name: SafeCheck Flutter Build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true
      - name: Reconstruct SafeCheck Flutter source
        shell: bash
        run: |
          cat .safecheck-ci/flutter-part-* | tr -d '\n\r ' | base64 -d > /tmp/safecheck_flutter.zip
          unzip -t /tmp/safecheck_flutter.zip
          rm -rf /tmp/safecheck_flutter
          mkdir -p /tmp/safecheck_flutter
          unzip -q /tmp/safecheck_flutter.zip -d /tmp/safecheck_flutter
          sha256sum /tmp/safecheck_flutter.zip
      - name: Flutter doctor
        run: flutter doctor -v
      - name: Pub get
        working-directory: /tmp/safecheck_flutter
        run: flutter pub get
      - name: Analyze
        working-directory: /tmp/safecheck_flutter
        run: flutter analyze
      - name: Tests
        working-directory: /tmp/safecheck_flutter
        run: flutter test
      - name: Create Android scaffold
        working-directory: /tmp/safecheck_flutter
        run: flutter create --platforms=android,web --org ai.safecheck --project-name safecheck_ai .
      - name: Re-run analyze after scaffold
        working-directory: /tmp/safecheck_flutter
        run: flutter analyze
      - name: Build APK
        working-directory: /tmp/safecheck_flutter
        run: flutter build apk --debug --dart-define=API_BASE_URL=https://api.example.invalid
      - name: Build web
        working-directory: /tmp/safecheck_flutter
        run: flutter build web --dart-define=API_BASE_URL=https://api.example.invalid
      - name: Hash artifacts
        working-directory: /tmp/safecheck_flutter
        run: |
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee build/app-debug.sha256
          tar -czf build/web-build.tar.gz -C build web
          sha256sum build/web-build.tar.gz | tee build/web-build.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: safecheck-flutter-part7
          path: |
            /tmp/safecheck_flutter/build/app/outputs/flutter-apk/app-debug.apk
            /tmp/safecheck_flutter/build/app-debug.sha256
            /tmp/safecheck_flutter/build/web-build.tar.gz
            /tmp/safecheck_flutter/build/web-build.sha256
          if-no-files-found: error
