name: Build SafeCheck AI APK

on:
  push:
    branches: [safecheck-ai-apk]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate SafeCheck JavaScript
        run: |
          node --check safecheck-android/app/src/main/assets/app.js
          node --check safecheck-android/app/src/main/assets/cloud-fix.js
          node --check safecheck-android/app/src/main/assets/risk-ui.js
          grep -q 'cloud-fix.js' safecheck-android/app/src/main/assets/index.html
          grep -q 'risk-ui.js' safecheck-android/app/src/main/assets/index.html
      - name: Check SafeCheck backend health
        run: |
          curl --fail --silent --show-error --max-time 20 \
            https://pwlblezbjnumlmqevcgu.supabase.co/functions/v1/anti-golpe-api/health \
            -o /tmp/safecheck-health.json
          python3 - <<'PY'
          import json
          data=json.load(open('/tmp/safecheck-health.json'))
          assert data.get('ok') is True, data
          assert data.get('databaseConfigured') is True, data
          assert data.get('aiConfigured') is True, data
          print('SafeCheck backend healthy; AI configured:', bool(data.get('aiConfigured')))
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build SafeCheck AI debug APK
        working-directory: safecheck-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: test -f safecheck-android/app/build/outputs/apk/debug/app-debug.apk && ls -lh safecheck-android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SafeCheck-AI-debug-apk
          path: safecheck-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
